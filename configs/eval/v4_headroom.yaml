# V4 terrain-native oracle-headroom protocol.
#
# This is declarative input for the required ``v4_headroom_matrix_v1`` runner
# interface described in ``legged_gym/scripts/eval/V4_HEADROOM.md``.  The
# current runner validates and preserves the explicit terrain-type, velocity,
# isolated-axis, policy-seed, and protocol-fingerprint dimensions.
schema_version: v4_headroom_matrix_v1
campaign: v4_headroom
artifact_root: logs/eval/v4_headroom
simulator: genesis
training_seeds: [1, 2]
execution:
  runner_interface: v4_headroom_matrix_v1
  status: ready_for_discovery
  do_not_execute_with_current_v3_eval: false
  # All cells use a fixed geometry seed.  Any rerun at a given terrain type /
  # level must retain its terrain hash across model and physics-axis cells.
  geometry_identity: terrain_hash_per_type_level

# This is a headroom precondition, not a method leaderboard: only the blind
# MLP and matched privileged oracle are allowed in this campaign.  Adaptation
# methods belong in a follow-up only after this pair exhibits usable headroom.
comparison_scope: matched_mlp_vs_superset_oracle_headroom
models:
  - {label: MLP, task: go2_v4_mlp, log_root: logs/go2_v4_terrain_curriculum, run_pattern: "*_v4_mlp_genesis_seed{seed}", run_paths: {1: Jul20_12-02-36_v4_mlp_genesis_seed1, 2: Jul24_15-28-10_v4_mlp_genesis_seed2}, checkpoint: best_spnte}
  - {label: Superset-Oracle, task: go2_v4_superset_oracle, log_root: logs/go2_v4_terrain_curriculum, run_pattern: "*_v4_superset_oracle_genesis_seed{seed}", run_paths: {1: Jul20_11-49-05_v4_superset_oracle_genesis_seed1, 2: Jul24_15-28-33_v4_superset_oracle_genesis_seed2}, checkpoint: best_spnte}

protocol:
  eval_seed: 1
  warmup_steps: 100
  measured_steps: 2000
  # Every cell holds a single selected terrain type, so replicas are not mixed
  # across terrain families.  This is deliberately distinct from v3_eval's
  # current all-types-in-one-env-batch layout.
  replicas_per_cell: 76
  commands:
    vx: [0.4, 0.6, 0.8, 1.0]
    vy: 0.0
    yaw_rate: 0.0
  terrain:
    generator: v4_curriculum_heightfield
    num_rows: 10
    num_cols: 5
    proportions: [0.2, 0.1, 0.25, 0.25, 0.2]
    types: [slope, random_uniform, stairs_down, stairs_up, discrete]
    levels: [1, 3, 5, 7, 9]
    measure_heights: true
  nominal_physics:
    mass_kg: 0.0
    com_x_m: 0.0
    friction: 1.0
  training_support:
    mass_kg: [-2.0, 5.0]
    com_x_m: [-0.08, 0.08]
    friction: [0.50, 1.25]

  # Primary result: one changing physical axis per cell.  The ID and OOD
  # points are deliberately bounded around the V4 training contract; they are
  # not a broad stress fishing expedition.  For every point, the runner pins
  # the other two named axes to ``nominal_physics`` before warmup.
  primary_isolated_axes:
    tier: primary_nominal_headroom
    pin_unswept_axes_to_nominal: true
    axes:
      - name: mass_kg
        dr_axis: added_mass
        id: [-2.0, 0.0, 5.0]
        ood: [-3.0, 6.0]
      - name: com_x_m
        dr_axis: com_x
        id: [-0.08, 0.0, 0.08]
        ood: [-0.10, 0.10]
      - name: friction
        dr_axis: friction
        id: [0.50, 0.875, 1.25]
        ood: [0.35, 1.50]

  # Secondary result only: correlated physics and payload.  It is never
  # pooled with primary single-axis cells for the headline gap-closed claim.
  secondary_combined_stress_payload:
    tier: secondary_combined_stress_payload
    terrain_levels: [5, 9]
    vx: [0.6, 1.0]
    scenarios:
      - {name: id_edge_forward_payload, mass_kg: 1.0, com_x_m: 0.03, friction: 0.50, band: id_composite}
      - {name: ood_mass_forward_payload, mass_kg: 2.0, com_x_m: 0.06, friction: 0.50, band: ood_composite}
      - {name: payload_plus4, mass_kg: 4.0, com_x_m: 0.04, friction: 0.75, band: payload_stress}
      - {name: payload_plus6, mass_kg: 6.0, com_x_m: 0.06, friction: 0.50, band: payload_stress}

  # 2 models x 2 seeds x 5 types x 5 levels x 4 vx x (3 axes x 5 points) =
  # 6,000 primary cells; the secondary tier adds 320. A matrix runner rejects a
  # plan that expands beyond this declared budget rather than duplicating work.
  planned_cell_budget: {primary: 6000, secondary: 320, total: 6320}

scorecard:
  baseline_label: MLP
  oracle_label: Superset-Oracle
  method_labels: []
  # Primary cells only.  The existing score gates remain physical gates; this
  # declaration forbids calculating one headline by mixing primary/secondary.
  headline_tier: primary_nominal_headroom
  relative_headroom: 0.10
  absolute_headroom: 0.10
  fall_gate_pp: 0.05
  achieved_speed_ratio: 0.90
