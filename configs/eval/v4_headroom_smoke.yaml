# Tiny deploy/planner smoke for the V4 headroom matrix interface.  It keeps the
# baseline/oracle pair plus both adaptive methods so cell identity, paired-seed
# scoring, report wiring, and method adapters are all exercised.  It deliberately
# covers just two primary cells and one secondary payload cell per model/seed.
# It is a contract smoke, not a scientific result.
schema_version: v4_headroom_matrix_v1
campaign: v4_headroom_smoke
artifact_root: logs/eval/v4_headroom_smoke
simulator: genesis
training_seeds: [1, 2]
execution:
  runner_interface: v4_headroom_matrix_v1
  status: ready_for_smoke
  do_not_execute_with_current_v3_eval: false
  geometry_identity: terrain_hash_per_type_level
models:
  - {label: MLP, task: go2_v4_mlp, log_root: logs/go2_v4_terrain_curriculum, run_pattern: "*_v4_mlp_genesis_seed{seed}", run_paths: {1: Jul20_12-02-36_v4_mlp_genesis_seed1, 2: Jul24_15-28-10_v4_mlp_genesis_seed2}, checkpoint: best_spnte}
  - {label: Superset-Oracle, task: go2_v4_superset_oracle, log_root: logs/go2_v4_terrain_curriculum, run_pattern: "*_v4_superset_oracle_genesis_seed{seed}", run_paths: {1: Jul20_11-49-05_v4_superset_oracle_genesis_seed1, 2: Jul24_15-28-33_v4_superset_oracle_genesis_seed2}, checkpoint: best_spnte}
  - {label: DreamWaQ, task: go2_v4_dreamwaq, log_root: logs/go2_v4_terrain_curriculum, run_pattern: "*_v4_dreamwaq_genesis_seed{seed}", run_paths: {1: Jul20_14-38-45_v4_dreamwaq_genesis_seed1, 2: Jul24_15-28-51_v4_dreamwaq_genesis_seed2}, checkpoint: best_spnte}
  - {label: HIM-fixed, task: go2_v4_him_fixed, log_root: logs/go2_v4_terrain_curriculum, run_pattern: "*_v4_him_fixed_genesis_seed{seed}", run_paths: {1: Jul20_15-00-57_v4_him_fixed_genesis_seed1, 2: Jul24_15-29-13_v4_him_fixed_genesis_seed2}, checkpoint: best_spnte}

protocol:
  eval_seed: 1
  warmup_steps: 8
  measured_steps: 32
  replicas_per_cell: 10
  commands: {vx: [0.8], vy: 0.0, yaw_rate: 0.0}
  terrain:
    generator: v4_curriculum_heightfield
    num_rows: 10
    num_cols: 5
    proportions: [0.2, 0.1, 0.25, 0.25, 0.2]
    types: [stairs_up]
    levels: [5]
    measure_heights: true
  nominal_physics: {mass_kg: 0.0, com_x_m: 0.0, friction: 1.0}
  training_support:
    mass_kg: [-2.0, 5.0]
    com_x_m: [-0.08, 0.08]
    friction: [0.50, 1.25]
  primary_isolated_axes:
    tier: primary_nominal_headroom
    pin_unswept_axes_to_nominal: true
    axes:
      - {name: mass_kg, dr_axis: added_mass, id: [0.0], ood: [6.0]}
  secondary_combined_stress_payload:
    tier: secondary_combined_stress_payload
    terrain_levels: [5]
    vx: [0.8]
    scenarios:
      - {name: payload_plus4, mass_kg: 4.0, com_x_m: 0.04, friction: 0.75, band: payload_stress}

scorecard:
  baseline_label: MLP
  oracle_label: Superset-Oracle
  method_labels: [DreamWaQ, HIM-fixed]
  headline_tier: primary_nominal_headroom
  relative_headroom: 0.10
  absolute_headroom: 0.10
  fall_gate_pp: 0.05
  achieved_speed_ratio: 0.90
