# Diagnostic replay: reproduce the old V4 terrain geometry and rollout budget
# while selecting the historical training-time tracking checkpoints.
schema_version: v4_headroom_matrix_v1
campaign: v4_legacy_replay_best_tracking
artifact_root: logs/eval/v4_legacy_replay_best_tracking
simulator: genesis
training_seeds: [1]
execution:
  runner_interface: v4_headroom_matrix_v1
  status: ready_for_checkpoint_ab_replay
  do_not_execute_with_current_v3_eval: false
  geometry_identity: terrain_hash_per_type_level
comparison_scope: v4_legacy_geometry_checkpoint_ab
models:
  - {label: MLP, task: go2_v4_mlp, log_root: logs/go2_v4_terrain_curriculum, run_pattern: "*_v4_mlp_genesis_seed{seed}", run_paths: {1: Jul20_12-02-36_v4_mlp_genesis_seed1}, checkpoint: best_tracking}
  - {label: Superset-Oracle, task: go2_v4_superset_oracle, log_root: logs/go2_v4_terrain_curriculum, run_pattern: "*_v4_superset_oracle_genesis_seed{seed}", run_paths: {1: Jul20_11-49-05_v4_superset_oracle_genesis_seed1}, checkpoint: best_tracking}
protocol:
  eval_seed: 41001
  warmup_steps: 100
  measured_steps: 2000
  replicas_per_cell: 76
  commands: {vx: [1.0], vy: 0.0, yaw_rate: 0.0}
  terrain:
    generator: v4_curriculum_heightfield
    num_rows: 10
    num_cols: 5
    proportions: [0.2, 0.1, 0.25, 0.25, 0.2]
    types: [random_uniform, stairs_up]
    levels: [3]
    measure_heights: true
  nominal_physics: {mass_kg: 0.0, com_x_m: 0.0, friction: 1.0}
  training_support:
    mass_kg: [-2.0, 5.0]
    com_x_m: [-0.08, 0.08]
    friction: [0.50, 1.25]
  primary_isolated_axes:
    tier: primary_nominal_headroom
    pin_unswept_axes_to_nominal: true
    axes:
      - {name: mass_kg, dr_axis: added_mass, id: [0.0], ood: [6.0]}
  secondary_combined_stress_payload:
    tier: secondary_combined_stress_payload
    terrain_levels: []
    vx: []
    scenarios: []
  planned_cell_budget: {primary: 8, secondary: 0, total: 8}
scorecard:
  baseline_label: MLP
  oracle_label: Superset-Oracle
  method_labels: []
  headline_tier: primary_nominal_headroom
  relative_headroom: 0.10
  absolute_headroom: 0.05
  fall_gate_pp: 0.05
  achieved_speed_ratio: 0.90
