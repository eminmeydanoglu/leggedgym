rollout:
  warmup_steps: 100
  steps: 1000
  domain_randomization: pinned_nominal

success:
  minimum_survival_steps: 900
  spnte_lin_lt: 0.30
  replica_success_rate_threshold: 0.90

selection:
  metric: spnte_v1
  version: ued_checkpoint_selection_v1
  primary_tolerance: 0.000001
  worst_task_fraction: 0.10
  # Offline schedule over existing model_<iter>.pt (save_interval may stay 200):
  # start target min_iteration; for each target take largest available <= target
  # (>= min_iteration, after previous pick); next target = pick + stride;
  # always include the final periodic checkpoint.
  min_iteration: 1000
  iteration_stride: 500
  always_include_final: true
  artifact_dir: ued_validation
  artifact_pattern: model_{iteration}.json
  best_artifact: best_spnte.pt
  secondary_artifact: best_tracking.pt
