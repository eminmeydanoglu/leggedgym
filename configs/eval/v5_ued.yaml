# Frozen V5 UED checkpoint-selection protocol.  Do not change this bank after
# a headline campaign starts: its fingerprint is stored with every validation
# result and selected checkpoint.
#
# Offline only: training keeps online tracking eval -> best_tracking.pt.
# After a run, score the scheduled iterations with ued_rollout, then
# select_checkpoint -> best_spnte.pt.  Nothing here is auto-launched by train.
campaign: v5_ued
schema_version: 1
validation_seed: 31001
eval_seed: 41001

validation_bank:
  version: v5_ued_bank_v2_r12_3axis
  terrain_types: [stairs_up, stairs_down, slope_up, slope_down, rough]
  terrain_levels: [0, 1, 2, 3]
  flat_terrain_type: flat
  flat_terrain_level: 0
  velocity_bin_edges: [0.0, 0.5, 1.0, 1.5, 2.0]
  # 3-axis command: vx binned above; vy / omega_z frozen per replica from this
  # shared nuisance support.  MUST equal Go2V5CommonCfg.commands.ranges
  # (lin_vel_y / ang_vel_yaw) so the offline bank and the online sampler share
  # one command distribution (solun_plani.md §2/§14.1).
  command_support:
    lin_vel_y: [-1.0, 1.0]
    ang_vel_yaw: [-1.0, 1.0]
  # 84 cells × 12 replicas = 1008 measurements (selection bank; not 48).
  replicas_per_cell: 12
  # Two disjoint command streams over the SAME terrain grid: the validation
  # bank (validation_seed) selects best_spnte.pt; the held-out bank (eval_seed)
  # measures that winner ONCE and never feeds selection (§7 / reviewer item 7).
  bank_fingerprint: dd1a2cd006a3774fd5f58ffe573e40a3fb63c2d3d917a5427bfa064abab09bcc
  holdout_bank_fingerprint: a00aa2ed52fd7a975c74004c75f83905f4dc5bfb7749a4b47ffe52c5faebebd5
  # Per-(terrain_type, level) SHA-256 over the ACTUAL int16 heightfield bytes of
  # each built tile (+ scale metadata), regenerable headless via
  #   python -m legged_gym.scripts.eval.ued_validation --config <this> --emit-geometry-pins
  # The rollout recomputes these from the real Genesis scene per replica, so a
  # mismatch means the policy ran on the wrong / corrupted geometry.  Level-0
  # slopes/flat share a hash because a 0.0-gradient tile IS flat (expected).
  geometry_hash_version: v5_ued_geometry_v2_hfbytes
  geometry_hashes:
    stairs_up:
      0: 31cc9460312530587cb4b4c840b7f6c206ca620dd1231aa2f7dca9e2ed47865f
      1: 686b1a5d3289b5e946969d7535ea57cc19588d66fad373066efacd5013dffe3b
