# Local RTX smoke profile.  It exercises the exact campaign CLI with every
# available seed-2 actor, while reducing cells/steps so it fits the 4GB laptop.
campaign: go2_tripler_v2_smoke
artifact_root: logs/eval/go2_tripler_v2_smoke_cli
simulator: genesis
smoke_only: true
training_seeds: [2]
models:
  - label: MLP
    task: go2_bench_mlp
    checkpoint: best
    run_folders: {2: Jul13_09-48-03_bench_mlp_genesis_seed2}
  - label: P5
    task: go2_bench_oracle_id
    checkpoint: best
    run_folders: {2: Jul13_09-48-51_bench_oracle_id_genesis_seed2}
  - label: P5+V
    task: go2_bench_oracle_id_vel
    checkpoint: best
    run_folders: {2: Jul13_10-34-29_bench_oracle_id_vel_genesis_seed2}
protocol:
  validation: {seed: 31001, num_envs: 8, warmup: 3, steps: 12}
  id: {seed: 41001, num_envs: 8, warmup: 3, steps: 16}
  axes: {seed: 41001, warmup: 3, steps: 12, replicas: 1, magnitudes: [0.5, 1.5]}
  hard:
    seed: 41001
    warmup: 3
    steps: 12
    terrain_replicas: 8
    terrain_horizontal_scale: 0.2
    kick_replicas: 2
    step_replicas: 2
    terrain_cm: [5]
    lateral_kick_mps: [0, 1.0]
    kick_step: 3
    recovery_steps: 9
    step_amplitudes: [1.0, 2.0]
    phase_steps: 4
axes:
  added_mass: {grid: [-2, 5], in_distribution: [-1, 1], unit: kg}
  friction: {grid: [0.1, 2.5], in_distribution: [0.5, 1.25], unit: ratio}
  com_x: {grid: [-0.08, 0.08], in_distribution: [-0.03, 0.03], unit: m}
  com_y: {grid: [-0.08, 0.08], in_distribution: [-0.03, 0.03], unit: m}
  com_z: {grid: [-0.08, 0.08], in_distribution: [-0.03, 0.03], unit: m}
  pd_gain_scale: {grid: [0.5, 1.5], in_distribution: [1.0, 1.0], unit: scale}
  control_delay: {grid: [0, 2], in_distribution: [0, 0], unit: control_step}
